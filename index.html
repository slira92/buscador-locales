<style>
:root{
  --bg:#f5f4f0; --panel:#ffffff; --ink:#1b1d21; --muted:#6b6f76; --line:#e4e2dd; --chip:#efeee9;

  --own:#6250d6; --arr:#2a78d6; --ven:#eb6834;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131416; --panel:#1c1d20; --ink:#ecebe8; --muted:#9a9ea5; --line:#2c2e33; --chip:#26282c;
    --accent:#4cc08f; --accent-soft:#183128; --warn:#f0a35c; --bad:#ef7d88; --bad-soft:#3a1d21;
    --own:#9085e9; --arr:#3987e5; --ven:#d95926; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#131416; --panel:#1c1d20; --ink:#ecebe8; --muted:#9a9ea5; --line:#2c2e33; --chip:#26282c;
  --accent:#4cc08f; --accent-soft:#183128; --warn:#f0a35c; --bad:#ef7d88; --bad-soft:#3a1d21;
  --own:#9085e9; --arr:#3987e5; --ven:#d95926; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
header{padding:18px 20px 10px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--muted);font-size:12px}
.filters{position:sticky;top:0;z-index:500;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.f{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.f label{color:var(--muted);font-size:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px;user-select:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px 20px 40px}
@media (min-width:1150px){ main{grid-template-columns:minmax(0,1fr) 420px} #mapWrap{position:sticky;top:64px;height:calc(100vh - 84px)} }
#mapWrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:340px}
#map{width:100%;height:100%;min-height:340px}
.listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;outline:2px solid transparent}
.card.hl{outline-color:var(--accent)}
.card.off{opacity:.5}
.ph{position:relative;aspect-ratio:16/10;background:var(--chip);cursor:pointer;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badges{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;right:80px}
.b{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--panel);color:var(--ink)}
.b.new{background:var(--accent);color:#fff}
.b.own{background:var(--own);color:#fff}
.b.arr{background:var(--arr);color:#fff}
.b.ven{background:var(--ven);color:#fff}
.b.cal{background:#1b1d21;color:#fff}
.acts{position:absolute;right:8px;top:8px;display:flex;gap:5px}
.ib{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#222;cursor:pointer;font-size:15px;padding:0}
.ib.on{color:#c99a06}
.score{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px}
.body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.price{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-size:12px;font-weight:400;color:var(--muted)}
.ufm2{font-size:12.5px;font-variant-numeric:tabular-nums}
.good{color:var(--accent);font-weight:600}
.over{color:var(--bad);font-weight:600}
.ttl{font-weight:600;line-height:1.3;cursor:pointer}
.addr{color:var(--muted);font-size:12.5px}
.specs{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.s{background:var(--chip);border-radius:5px;padding:2px 7px;font-size:12px}
.why2{font-size:12px;color:var(--muted)}
.est{color:var(--warn)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;font-size:12px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 2px}
.panel .note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.mini{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.mini img{width:64px;height:48px;object-fit:cover;border-radius:6px;background:var(--chip);display:block}
.mini .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .r{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 4px}
.stats div{font-size:12px;color:var(--muted)}
.stats b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
dialog{border:0;border-radius:14px;padding:0;max-width:820px;width:calc(100% - 32px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-h{display:flex;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-b{padding:14px 16px;max-height:75vh;overflow:auto}
.gal{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.gal img{height:190px;border-radius:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;margin:12px 0}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:3px 0;font-size:13px}
.kv span{color:var(--muted)}
.bars{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.bar{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.bar i{display:block;width:34px;height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--ink)}
textarea{width:100%;min-height:60px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);font:inherit}
.desc{white-space:pre-wrap;font-size:13px;color:var(--muted)}
@media (max-width:640px){ header,.filters,main{padding-left:16px;padding-right:16px} .f.grow{flex:1 1 100%} input[type=search]{width:100%} }
</style>
</head>

<script>
const LS = {

};
const TIPOS = ['Strip center','Stand alone','Placa comercial','Local / otro','Mall / galería','Galpón / bodega','Derecho de llave'];
const TIPOS_DEF = TIPOS.slice(0, 5);  // galpón/bodega y derecho de llave apagados por defecto

const fav = new Set(LS.get('fav', [])), desc = new Set(LS.get('desc', [])), notas = LS.get('notas', {});
const F = Object.assign({ciudades:null, ops:['arriendo','venta'], cal:['calza','cercano'], tipos:TIPOS_DEF.slice(),
  est:false, dueno:false, fav:false, desc:false, q:'', ord:'puntaje', vista:'resumen'}, LS.get('filtros', {}));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n, d=0) => n == null ? '–' : n.toLocaleString('es-CL', {minimumFractionDigits:d, maximumFractionDigits:d});
const uf = (n, d=0) => n == null ? '–' : 'UF ' + nf(n, d);
const pct = v => (v > 0 ? '+' : '') + Math.round(v*100) + '%';

const med = xs => { const s = xs.filter(x => x != null).sort((a,b)=>a-b), n = s.length; return !n ? null : n % 2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2 };
const PESOS = [['precio_vs_mercado','Precio vs mercado'],['calce_m2','Calce m²'],['estacionamientos','Estac.'],['ubicacion','Ubicación'],['tipo','Tipo']];

if(DATA && !F.ciudades) F.ciudades = DATA.meta.busquedas.map(b => b.ciudad);
const guardar = () => LS.set('filtros', F);

function visibles(){
  const q = F.q.trim().toLowerCase();
  const r = DATA.avisos.filter(a => a.activo
    && F.ciudades.includes(a.ciudad) && F.ops.includes(a.operacion) && F.cal.includes(a.calce === 'sin m²' ? 'fuera' : a.calce)
    && F.tipos.includes(a.tipo)
    && (!F.est || a.estacionamientos > 0) && (!F.dueno || a.publica === 'Dueño') && (!F.fav || fav.has(a.id))
    && (F.desc || !desc.has(a.id)) && (!q || (a.titulo + ' ' + a.direccion).toLowerCase().includes(q)));
  const objetivo = a => { const b = busq[a.ciudad]; return b && a.m2 ? Math.abs(a.m2 - (b.m2_min + b.m2_max)/2) : 1e9 };
  const key = {
    puntaje: (a,b) => (b.puntaje ?? -1) - (a.puntaje ?? -1),
    ufm2: (a,b) => ((a.dudoso ? 1e9 : a.uf_m2) ?? 1e9) - ((b.dudoso ? 1e9 : b.uf_m2) ?? 1e9),
    m2: (a,b) => objetivo(a) - objetivo(b),
    nuevo: (a,b) => (b.primera_vez || '').localeCompare(a.primera_vez || ''),
  }[F.ord] || (() => 0);
  return r.sort(key);
}

function vsTxt(a){
  if(a.dudoso) return '<span class="over">⚠ dato inusual</span>';
  if(a.vs_mercado == null) return '';
  const c = a.vs_mercado <= -0.05 ? 'good' : a.vs_mercado >= 0.05 ? 'over' : '';
  return `<span class="${c}">${pct(a.vs_mercado)} vs mediana ${esc(a.ciudad)}</span>`;
}
function precio(a){
  if(a.precio_uf == null) return '<span class="sub">Precio a consultar</span>';
  return a.operacion === 'arriendo' ? `${uf(a.precio_uf, a.precio_uf < 100 ? 1 : 0)} <small>/mes</small>` : `${uf(a.precio_uf)} <small>venta</small>`;
}
function m2txt(a){

  return a.m2 ? `${nf(a.m2)} m²` : 'sin m²';
}
function quien(a){

}
function badges(a){
  let h = `<span class="b ${a.operacion === 'arriendo' ? 'arr' : 'ven'}">${a.operacion === 'arriendo' ? 'ARRIENDO' : 'VENTA'}</span>`;
  h += `<span class="b">${esc(a.tipo).toUpperCase()}</span>`;

  if(a.publica === 'Dueño') h += '<span class="b own">DUEÑO</span>';
  return h;
}
function card(a){

      ${a.puntaje != null ? `<div class="score">${a.puntaje} pts</div>` : ''}
      <div class="acts"><button class="ib${f?' on':''}" data-fav="${a.id}" title="Favorito">${f?'★':'☆'}</button>
        <button class="ib" data-desc="${a.id}" title="${d?'Restaurar':'Descartar'}">${d?'↺':'✕'}</button></div></div>
    <div class="body">
      <div class="price">${precio(a)}</div>
      <div class="ufm2">${a.uf_m2 != null ? `${uf(a.uf_m2, a.operacion === 'arriendo' ? 3 : 1)}/m²` : ''} ${vsTxt(a)}</div>
      <div class="ttl" data-open="${a.id}">${esc(a.titulo)}</div>
      <div class="addr">${esc(a.direccion)}</div>
      <div class="specs"><span class="s">${m2txt(a)}</span>${a.estacionamientos ? `<span class="s">${a.estacionamientos} estac.</span>` : ''}${a.pisos ? `<span class="s">${esc(a.pisos)} pisos</span>` : ''}${a.ggcc_uf ? `<span class="s">GGCC ${uf(a.ggcc_uf,1)}</span>` : ''}</div>
      ${a.publica ? `<div class="why2">Publica: ${quien(a)}</div>` : ''}
      ${(a.razones||[]).length ? `<div class="why2">${a.razones.map(esc).join(' · ')}</div>` : ''}
      ${notas[a.id] ? `<div class="sub">📝 ${esc(notas[a.id])}</div>` : ''}
      <div class="foot"><span>${esc(a.ciudad)} · visto ${hace(a.primera_vez)}</span><a href="${esc(a.url)}" target="_blank" rel="noopener">Ver aviso ↗</a></div>
    </div></article>`;
}
function mini(a){
  return `<div class="mini" data-open="${a.id}">${a.foto ? `<img loading="lazy" src="${esc(a.foto)}" alt="">` : '<img alt="">'}
    <div style="min-width:0"><div class="t">${esc(a.titulo)}</div>
      <div class="addr">${esc(a.tipo)} · ${m2txt(a)}${a.estacionamientos ? ` · ${a.estacionamientos} estac.` : ''}${a.publica ? ` · ${quien(a)}` : ''}</div></div>
    <div class="r"><b>${a.puntaje ?? '–'} pts</b><div>${precio(a)}</div><div class="ufm2">${a.uf_m2 != null ? uf(a.uf_m2, a.operacion === 'arriendo' ? 3 : 1) + '/m²' : ''}</div></div></div>`;
}
function resumen(r){
  return F.ciudades.map(c => {
    const b = busq[c], xs = r.filter(a => a.ciudad === c);
    const ops = F.ops.map(op => {
      const ys = xs.filter(a => a.operacion === op);
      const base = DATA.avisos.filter(a => a.activo && a.ciudad === c && a.operacion === op && !a.dudoso && a.uf_m2);
      const m = med(base.map(a => a.uf_m2));
      const top = ys.slice().sort((p,q) => (q.puntaje ?? -1) - (p.puntaje ?? -1)).slice(0, 4);
      return `<div style="margin-top:10px"><b>${op === 'arriendo' ? 'Arriendo' : 'Venta'}</b>
        <div class="stats"><div><b>${ys.filter(a => a.calce === 'calza').length}</b>calzan</div><div><b>${ys.filter(a => a.calce === 'cercano').length}</b>cercanos</div>
        <div><b>${m ? uf(m, op === 'arriendo' ? 3 : 1) : '–'}</b>mediana UF/m² (${base.length} avisos)</div></div>
        ${top.length ? top.map(mini).join('') : '<p class="note">Nada con estos filtros.</p>'}</div>`;
    }).join('');
    return `<div class="panel"><h2>${esc(c)}</h2><p class="note">Pedido: ${esc(b ? b.pedido : '')} · calza ${b ? nf(b.m2_min) + '–' + nf(b.m2_max) : ''} m²</p>${ops}</div>`;
  }).join('') || '<div class="empty">Elige al menos una ciudad.</div>';
}
function tabla(r){

  ${r.map(a => `<tr><td class="n"><b>${a.puntaje ?? '–'}</b></td><td>${esc(a.ciudad)}</td><td>${a.operacion}</td><td>${esc(a.tipo)}</td>

    <td><a href="${esc(a.url)}" target="_blank" rel="noopener">↗</a></td></tr>`).join('')}</tbody></table></div>`;
}

let map, layer, markers = {};
function initMap(){
  if(typeof L === 'undefined'){ $('#mapWrap').innerHTML = '<div class="empty">Mapa no disponible sin internet</div>'; return }
  map = L.map('map').setView([-35.5, -71.8], 6);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {attribution:'Tiles © Esri', maxZoom:19}).addTo(map);
  layer = L.layerGroup().addTo(map);
}
function drawMap(r){
  if(!map) return;
  layer.clearLayers(); markers = {};
  const pts = [];
  r.forEach(a => {
    if(a.lat == null) return;
    const color = a.operacion === 'arriendo' ? '#2a78d6' : '#eb6834';
    const m = L.circleMarker([a.lat, a.lon], {radius: a.calce === 'calza' ? 8 : 6, color:'#fff', weight:1.5, fillColor:color, fillOpacity:.95})
      .bindPopup(`<b>${a.puntaje ?? '–'} pts</b> · ${precio(a)}<br>${esc(a.titulo)}<br>${m2txt(a)} · ${esc(a.tipo)}<br><a href="#" data-open="${a.id}">Ver ficha</a> · <a href="${esc(a.url)}" target="_blank">Aviso ↗</a>`);
    m.addTo(layer); markers[a.id] = m; pts.push([a.lat, a.lon]);
  });
  // el contenedor puede no tener tamaño todavía en el primer render: recalcular antes de encuadrar
  requestAnimationFrame(() => { map.invalidateSize(); if(pts.length) map.fitBounds(pts, {padding:[24,24], maxZoom:14}) });
}

function render(){
  if(!DATA){ $('#list').innerHTML = '<div class="empty">Aún no hay datos. Ejecuta <code>py buscador_locales.py</code>.</div>'; return }
  const r = visibles(), m = DATA.meta, act = DATA.avisos.filter(a => a.activo);

  $('#kpis').innerHTML = [[act.filter(a => a.calce === 'calza').length, 'calzan en m²'], [act.filter(a => a.calce === 'cercano').length, 'cercanos'],
    [act.filter(a => a.calce !== 'fuera' && a.publica === 'Dueño').length, 'de dueño'], [fav.size, 'favoritos']]
    .map(([v,l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
  $('#count').textContent = `${r.length} ubicaciones`;
  $('#status').textContent = ult ? `Última búsqueda: ${new Date(ult.fecha).toLocaleString('es-CL')} · ${ult.avisos} avisos revisados${ult.bloqueo ? ' · ⚠ bloqueo parcial' : ''}` : '';
  $('#list').innerHTML = F.vista === 'tabla' ? tabla(r) : F.vista === 'cards' ? (r.length ? `<div class="grid">${r.map(card).join('')}</div>` : '<div class="empty">Nada con estos filtros.</div>') : resumen(r);
  drawMap(r);
}
function sync(){
  document.querySelectorAll('[data-ciudad]').forEach(c => c.setAttribute('aria-pressed', F.ciudades.includes(c.dataset.ciudad)));
  document.querySelectorAll('[data-op]').forEach(c => c.setAttribute('aria-pressed', F.ops.includes(c.dataset.op)));
  document.querySelectorAll('[data-cal]').forEach(c => c.setAttribute('aria-pressed', F.cal.includes(c.dataset.cal)));
  document.querySelectorAll('[data-tipo]').forEach(c => c.setAttribute('aria-pressed', F.tipos.includes(c.dataset.tipo)));
  document.querySelectorAll('[data-v]').forEach(c => c.setAttribute('aria-pressed', F.vista === c.dataset.v));
  [['#fEst','est'],['#fDueno','dueno'],['#fFav','fav'],['#fDesc','desc']].forEach(([s,k]) => $(s).setAttribute('aria-pressed', !!F[k]));
  $('#fQ').value = F.q; $('#fOrd').value = F.ord;
}
const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
function update(){ guardar(); sync(); render() }

function openDlg(id){
  const a = DATA.avisos.find(x => x.id === id); if(!a) return;
  const fotos = (a.fotos && a.fotos.length ? a.fotos : [a.foto]).filter(Boolean);
  const hist = (a.historial_precio || []).map(([f,p,m]) => `${f}: ${m === 'CLF' ? 'UF ' + nf(p, 1) : '$' + nf(p)}`).join(' → ');
  $('#dlg').innerHTML = `<div class="dlg-h"><div><div class="price">${precio(a)}</div><div class="ttl">${esc(a.titulo)}</div><div class="addr">${esc(a.direccion)}</div></div>
      <div><button class="chip" data-close>Cerrar</button></div></div>
    <div class="dlg-b">
      <div class="gal">${fotos.map(f => `<img loading="lazy" src="${esc(f)}" alt="">`).join('')}</div>
      <div class="panel" style="margin:12px 0;padding:12px"><b>${a.puntaje ?? '–'} pts</b> · ${a.uf_m2 != null ? uf(a.uf_m2, a.operacion === 'arriendo' ? 3 : 1) + '/m²' : 'sin UF/m²'} · ${vsTxt(a)}
        ${a.mercado_uf_m2 ? `<div class="sub">Mediana ${esc(a.ciudad)} ${a.operacion}: ${uf(a.mercado_uf_m2, a.operacion === 'arriendo' ? 3 : 1)}/m² (${a.comps} avisos)</div>` : ''}
        ${a.puntaje_det ? `<div class="bars">${PESOS.map(([k,l]) => `<span class="bar" title="${l}: ${a.puntaje_det[k]}/100">${l}<i><b style="width:${a.puntaje_det[k]}%"></b></i></span>`).join('')}</div>` : ''}
        ${(a.razones||[]).length ? `<div class="why2" style="margin-top:6px">${a.razones.map(esc).join(' · ')}</div>` : ''}</div>
      <div class="specs">${badges(a)}</div>
      <div class="kv">${[['Ciudad', a.ciudad], ['Superficie', m2txt(a)], ['Calce', a.calce + ' (pedido ' + (busq[a.ciudad] || {}).pedido + ')'], ['Publica', a.publica ? (a.vendedor.nombre || a.publica) + ' (' + a.publica + ')' : '–']]
        .concat(Object.entries(a.specs || {}).filter(([k]) => !/Superficie|Precio por/.test(k)))
        .map(([k,v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
      ${hist ? `<p class="sub">Historial de precio: ${hist}</p>` : ''}
      <label class="sub">Notas</label><textarea id="nota">${esc(notas[a.id] || '')}</textarea>
      ${a.descripcion ? `<h3 style="font-size:14px;margin:14px 0 4px">Descripción</h3><div class="desc">${esc(a.descripcion)}</div>` : ''}
      <p style="margin-top:14px"><a href="${esc(a.url)}" target="_blank" rel="noopener">Abrir aviso en Portal Inmobiliario ↗</a></p></div>`;
  $('#dlg').showModal();
  $('#nota').addEventListener('input', e => { const v = e.target.value.trim(); if(v) notas[id] = v; else delete notas[id]; LS.set('notas', notas) });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-fav],[data-desc],[data-open],[data-close],[data-ciudad],[data-op],[data-cal],[data-tipo],[data-v]');
  if(!t) return;
  if(t.dataset.fav){ const id = t.dataset.fav; fav.has(id) ? fav.delete(id) : fav.add(id); LS.set('fav', [...fav]); render() }
  else if(t.dataset.desc){ const id = t.dataset.desc; desc.has(id) ? desc.delete(id) : desc.add(id); LS.set('desc', [...desc]); render() }
  else if(t.dataset.open){ e.preventDefault(); openDlg(t.dataset.open) }
  else if('close' in t.dataset){ $('#dlg').close(); render() }
  else if(t.dataset.ciudad){ F.ciudades = toggle(F.ciudades, t.dataset.ciudad); update() }
  else if(t.dataset.op){ F.ops = toggle(F.ops, t.dataset.op); update() }
  else if(t.dataset.cal){ F.cal = toggle(F.cal, t.dataset.cal); update() }
  else if(t.dataset.tipo){ F.tipos = toggle(F.tipos, t.dataset.tipo); update() }
  else if(t.dataset.v){ F.vista = t.dataset.v; update() }
});
[['#fEst','est'],['#fDueno','dueno'],['#fFav','fav'],['#fDesc','desc']].forEach(([s,k]) => $(s).addEventListener('click', () => { F[k] = !F[k]; update() }));
$('#fQ').addEventListener('input', e => { F.q = e.target.value; guardar(); render() });
$('#fOrd').addEventListener('change', e => { F.ord = e.target.value; update() });

if(DATA){
  $('#fCiudades').insertAdjacentHTML('beforeend', DATA.meta.busquedas.map(b => `<span class="chip" data-ciudad="${esc(b.ciudad)}">${esc(b.ciudad)}</span>`).join(''));
  $('#fTipos').insertAdjacentHTML('beforeend', TIPOS.map(t => `<span class="chip" data-tipo="${esc(t)}">${esc(t)}</span>`).join(''));
}
sync(); initMap(); render();
setInterval(() => { if(!$('#dlg').open) location.reload() }, 300000);
</script>
</body>
</html>
